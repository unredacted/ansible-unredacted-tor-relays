    #       $IPT -t mangle -A OUTPUT -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1354
    #       echo "IPv4 MSS clamp applied"
    #
    #       # Clamp TCP MSS to 1334 for IPv4 on output chain
    #       $IP6T -t mangle -C OUTPUT -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1334 2>/dev/null || \
    #       $IP6T -t mangle -A OUTPUT -p tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss 1334
    #       echo "IPv6 MSS clamp applied"
    #
    # - name: Create systemd unit to apply system bootstrap script boot
    #   ansible.builtin.copy:
    #     dest: /etc/systemd/system/system-bootstrap.service
    #     content: |
    #       [Unit]
    #       Description=Apply system bootstrap script
    #       After=network-online.target
    #       Wants=network-online.target
    #
    #       [Service]
    #       Type=oneshot
    #       ExecStart=/usr/local/bin/system-bootstrap.sh
    #       RemainAfterExit=yes
    #
    #       [Install]
    #       WantedBy=multi-user.target
    #
    # - name: Enable and start system bootstrap systemd service
    #   ansible.builtin.systemd:
    #     name: system-bootstrap.service
    #     enabled: yes
    #     state: started

    # Commenting the tasks out is not enough on hosts that already ran them:
    # the rules stay in the running firewall until reboot, and the enabled
    # system-bootstrap.service would re-add them at every boot.
    - name: Stop and disable the MSS clamp bootstrap service
      ansible.builtin.command: systemctl disable --now system-bootstrap.service
      args:
        removes: /etc/systemd/system/system-bootstrap.service

    - name: Remove the MSS clamp bootstrap service and script
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/system-bootstrap.service
        - /usr/local/bin/system-bootstrap.sh
      register: mss_clamp_files

    # Deletes only the exact rules system-bootstrap.sh has ever added (per git
    # history: IPv4 MSS 1300/1354 and IPv6 MSS 1334, on mangle INPUT/OUTPUT,
    # with no other selectors), so independently managed MSS rules survive.
    # -w waits for the xtables lock, and any failed list or delete fails the
    # task (errexit) instead of leaving a clamp behind while reporting success.
    - name: Remove MSS clamp rules from the running firewall
      ansible.builtin.shell: |
        set -o errexit -o pipefail
        rule_re='-A (INPUT|OUTPUT) -p tcp -m tcp --tcp-flags SYN,RST SYN -j TCPMSS --set-mss'
        removed=0
        for spec in "iptables (1300|1354)" "ip6tables 1334"; do
          read -r ipt mss <<< "$spec"
          command -v "$ipt" >/dev/null || continue
          rules=$("$ipt" -w -t mangle -S)
          matches=$(grep -xE -- "$rule_re $mss" <<< "$rules" || true)
          while read -r rule; do
            [ -n "$rule" ] || continue
            "$ipt" -w -t mangle ${rule/#-A /-D }
            removed=1
          done <<< "$matches"
        done
        echo "removed=$removed"
      args:
        executable: /bin/bash
      register: mss_clamp_rules
      changed_when: "'removed=1' in mss_clamp_rules.stdout"

    # ZeroTier is no longer used: Ansible and the MetricsPort scraper reach
    # relays over Tailscale. Purging stops the service (prerm), which also
    # drops the routes the ZeroTier controller pushed for other relays' IPs.
    - name: Purge ZeroTier
      ansible.builtin.apt:
        name: zerotier-one
        state: absent
        purge: yes
      register: zerotier_purge

    # None of these are owned by the package, so purge leaves them behind:
    # the node identity (identity.secret), network configs and peer cache,
    # plus the apt source and signing key added by ZeroTier's installer.
    - name: Remove ZeroTier state, apt source and signing key
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /var/lib/zerotier-one
        - /etc/apt/sources.list.d/zerotier.list
        - /usr/share/keyrings/zerotier-debian-package-key.gpg

    - name: Reload systemd after removing the bootstrap and ZeroTier units
      ansible.builtin.systemd:
        daemon_reload: yes
      when: mss_clamp_files.changed or zerotier_purge.changed

    - name: Stop and disable Unbound before resolved takes over
      ansible.builtin.service:
        name: unbound
        state: stopped
        enabled: no
      failed_when: false

  post_tasks:
    - name: Remove Unbound if previously installed
      apt:
        name: unbound
        state: absent
        purge: yes

    - name: Ensure resolv.conf points to systemd-resolved stub
      ansible.builtin.file:
        path: /etc/resolv.conf
        src: /run/systemd/resolve/stub-resolv.conf
        state: link
        force: yes

